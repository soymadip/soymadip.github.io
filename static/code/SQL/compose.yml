services:
  mysql:
    image: mariadb:latest
    command: mariadbd --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=20
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_SU_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # pgsql:
  #   image: postgres:latest
  #   restart: always
  #   environment:
  #     POSTGRES_PASSWORD: ${DB_SU_PASSWORD}
  #     POSTGRES_DB: ${DB_DATABASE}
  #   ports:
  #     - '5432:5432'
  #   volumes:
  #     - pgsql_data:/var/lib/postgresql

  dbx:
    image: t8y2/dbx:latest
    restart: always
    depends_on:
      - mysql
      # - pgsql
    ports:
      - "4224:4224"
    extra_hosts:
      - 'host.local:host-gateway'
    environment:
      DBX_DISABLE_PASSWORD: "1"
    volumes:
      - dbx_data:/app/data
      - .:/app/code

volumes:
  mariadb_data:
  pgsql_data:
  dbx_data:
