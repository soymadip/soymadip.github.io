version: 2
updates:
  # Keeps Docusaurus and all Node.js packages updated
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    # Groups minor and patch updates into a single PR to avoid PR spam
    groups:
      docusaurus-and-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keeps your GitHub Pages build/deploy workflow actions updated
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
